[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rastermint"
dynamic = ["version"]
description = "Qt Quick/QML desktop palette, dithering, hardware-look, and motion-effects editor"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Draconov" }]
keywords = ["dithering", "image-processing", "pixel-art", "pyside6", "qml", "qt-quick", "palette"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "PySide6-Essentials>=6.11,<7",
    "numpy>=2.0,<3",
    "Pillow>=11,<13",
    "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.21,<7"]

[project.scripts]
rastermint-cli = "rastermint.cli:main"

[project.gui-scripts]
rastermint = "rastermint.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.package-data]
rastermint = ["data/hardware_profiles/*.json", "data/icons/*", "data/themes/*.json", "data/palettes/*.json", "data/palettes/base/*.json", "data/palettes/extended/*.json", "data/presets/*.json", "qml/*.qml", "qml/components/*.qml", "qml/pages/*.qml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
