[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rastermint"
version = "0.1.0"
description = "Desktop palette and dithering image processor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RasterMint contributors" }]
keywords = ["dithering", "image-processing", "pixel-art", "pyside6", "palette"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "PySide6>=6.11,<7",
    "numpy>=2.0,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.21,<7"]

[project.scripts]
rastermint-cli = "rastermint.cli:main"

[project.gui-scripts]
rastermint = "rastermint.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
