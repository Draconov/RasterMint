name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: python -m pytest --ignore=tests/test_qml_runtime.py
