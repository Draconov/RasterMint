name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rastermint-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: RasterMint-Windows
            artifact_path: release/RasterMint.exe
          - name: Linux
            os: ubuntu-latest
            artifact_name: RasterMint-Linux
            artifact_path: release/RasterMint-linux-x86_64.tar.gz
          - name: macOS
            os: macos-latest
            artifact_name: RasterMint-macOS
            artifact_path: release/RasterMint-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0
          python -m pip install -e ".[dev]"

      # Linux owns the normal suite, but not the QtQuick runtime smoke test.
      # QtQuick repeatedly terminates the GitHub headless Ubuntu process with
      # native SIGSEGV/SIGABRT signals rather than producing pytest failures.
      - name: Run tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          python -m pytest --ignore=tests/test_qml_runtime.py

      # Keep real QML runtime coverage, but run it on Windows where QtQuick
      # does not depend on the unstable headless Linux graphics teardown path.
      - name: Install Windows QML test dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run QML runtime tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests/test_qml_runtime.py

      # Use a fixed vcpkg registry/tool revision so GitHub runner image updates
      # do not invalidate FFmpeg/x264 package ABIs and force 20-30 minute rebuilds.
      - name: Checkout pinned vcpkg
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: build/vcpkg-tool
          fetch-depth: 1

      - name: Set up pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\build\vcpkg-tool\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\build\vcpkg-tool" >> $env:GITHUB_ENV
          "VCPKG_INSTALLATION_ROOT=$env:GITHUB_WORKSPACE\build\vcpkg-tool" >> $env:GITHUB_ENV

      - name: Set up pinned vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/build/vcpkg-tool/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/build/vcpkg-tool" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLATION_ROOT=$GITHUB_WORKSPACE/build/vcpkg-tool" >> "$GITHUB_ENV"

      # Cache compiled packages only. Downloads are deliberately omitted to keep
      # the cache small and reduce eviction pressure; a binary-cache hit does not
      # need the source archives anyway.
      - name: Restore Windows FFmpeg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-vcpkg/cache/binary
          key: rastermint-ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-2026.07.29-${{ hashFiles('build/ffmpeg-vcpkg/vcpkg.json') }}
          restore-keys: |
            rastermint-ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-2026.07.29-
            vcpkg-ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Linux FFmpeg binary cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-vcpkg/cache/linux/binary
          key: rastermint-ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-2026.07.29-${{ hashFiles('build/ffmpeg-vcpkg/vcpkg.json') }}
          restore-keys: |
            rastermint-ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-2026.07.29-
            vcpkg-ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish / update release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all platform builds
        uses: actions/download-artifact@v8
        with:
          pattern: RasterMint-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/RasterMint.exe
          test -f release-assets/RasterMint-linux-x86_64.tar.gz
          test -f release-assets/RasterMint-macOS.zip
          ls -lh release-assets

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must contain a version such as 0.7.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish or refresh rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # VERSION is the release identity. Repeated pushes at the same version
          # replace the binaries instead of creating junk build-number releases.
          git fetch --tags --force
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/RasterMint.exe \
              release-assets/RasterMint-linux-x86_64.tar.gz \
              release-assets/RasterMint-macOS.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/RasterMint.exe \
              release-assets/RasterMint-linux-x86_64.tar.gz \
              release-assets/RasterMint-macOS.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "RasterMint v${RELEASE_VERSION}" \
              --generate-notes
          fi
