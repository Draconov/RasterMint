name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rastermint-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: RasterMint-Windows
            artifact_path: release/RasterMint.exe
          - name: Linux
            os: ubuntu-latest
            artifact_name: RasterMint-Linux
            artifact_path: release/RasterMint-linux-x86_64.tar.gz
          - name: macOS
            os: macos-latest
            artifact_name: RasterMint-macOS
            artifact_path: release/RasterMint-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt test runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
          python -m pip install -e ".[dev]"

      # Keep normal tests away from the Qt Quick process. This prevents a
      # QGuiApplication/Qt Quick teardown crash from taking down unrelated tests.
      - name: Run non-QML tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          python -m pytest --ignore=tests/test_qml_runtime.py

      # Qt Quick gets its own process and a virtual X server on Linux.
      # Using xcb + software rendering is more stable than destroying an
      # offscreen Qt Quick scene at the end of the full pytest process.
      - name: Run QML runtime tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          QT_OPENGL: software
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest tests/test_qml_runtime.py

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish / update release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: RasterMint-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/RasterMint.exe
          test -f release-assets/RasterMint-linux-x86_64.tar.gz
          test -f release-assets/RasterMint-macOS.zip
          ls -lh release-assets

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must contain a version such as 0.7.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish or refresh rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # VERSION is the release identity. Repeated pushes at the same version
          # replace the binaries instead of creating junk build-number releases.
          git fetch --tags --force
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/RasterMint.exe \
              release-assets/RasterMint-linux-x86_64.tar.gz \
              release-assets/RasterMint-macOS.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/RasterMint.exe \
              release-assets/RasterMint-linux-x86_64.tar.gz \
              release-assets/RasterMint-macOS.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "RasterMint v${RELEASE_VERSION}" \
              --generate-notes
          fi
