name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a run while it may be replacing release assets. New pushes wait,
# then refresh the same version again with the newest successful build.
concurrency:
  group: rastermint-rolling-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: RasterMint-Windows
            artifact_path: release/RasterMint.exe
          - name: Linux
            os: ubuntu-latest
            artifact_name: RasterMint-Linux
            artifact_path: release/RasterMint-linux-x86_64.tar.gz
          - name: macOS
            os: macos-latest
            artifact_name: RasterMint-macOS
            artifact_path: release/RasterMint-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # QtGui/Qt Quick dynamically load Linux graphics/runtime libraries even
      # when the QML smoke test uses the offscreen + software backends.
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      # One test run is enough. Keeping it inside the Linux build avoids a
      # separate fourth job on every push.
      - name: Run tests
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Cache lean FFmpeg packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: rastermint-ffmpeg-${{ runner.os }}-${{ hashFiles('build/ffmpeg-vcpkg/vcpkg.json') }}
          restore-keys: |
            rastermint-ffmpeg-${{ runner.os }}-

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Release builds must not silently fall back to the much larger
          # imageio wheel FFmpeg; local builds may still use that safe fallback.
          RASTERMINT_REQUIRE_LEAN_FFMPEG: "1"
        run: ./scripts/build_windows.ps1

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish / update release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all platform builds
        uses: actions/download-artifact@v8
        with:
          pattern: RasterMint-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/RasterMint.exe
          test -f release-assets/RasterMint-linux-x86_64.tar.gz
          test -f release-assets/RasterMint-macOS.zip
          ls -lh release-assets

      - name: Read version from VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "VERSION file is missing" >&2
            exit 1
          fi

          version="$(tr -d '\r\n' < VERSION)"
          if [[ -z "$version" || "$version" =~ [[:space:]] ]]; then
            echo "VERSION must contain one non-empty version string with no spaces" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RasterMint version: $version"
          echo "Rolling release tag: $tag"

      - name: Move or create release tag at this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Moving existing $TAG to $GITHUB_SHA"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            echo "Creating $TAG at $GITHUB_SHA"
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          printf -v notes '%s\n\n%s' \
            "Rolling build for RasterMint v${VERSION}." \
            "Automatically rebuilt from commit \`${short_sha}\`. Every successful push to main replaces the application files for this version."

          assets=(
            release-assets/RasterMint.exe
            release-assets/RasterMint-linux-x86_64.tar.gz
            release-assets/RasterMint-macOS.zip
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refreshing existing release $TAG"

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RasterMint $TAG" \
              --target "$GITHUB_SHA" \
              --notes "$notes" \
              --latest

            # --clobber replaces assets that already have these names.
            gh release upload "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release $TAG"

            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "RasterMint $TAG" \
              --notes "$notes" \
              --latest
          fi

          echo "Published RasterMint $TAG from $GITHUB_SHA"
