name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Build single EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = $env:VERSION
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }

          $releaseJson = & gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query existing GitHub Releases."
          }
          $existing = $releaseJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag }
          if ($existing) {
            throw "Release $tag already exists. Delete that release/tag first or choose another version."
          }

          $args = @(
            "release", "create", $tag,
            "release/RasterMint.exe",
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--generate-notes",
            "--title", "RasterMint $tag"
          )
          if ($env:PRERELEASE -eq "true") { $args += "--prerelease" }
          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }
